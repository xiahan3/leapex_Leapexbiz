<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Leapex 金色图标</title>
  <desc id="desc">核心金色 #D4A853，浅金 #F4D9A6，深金 #B8860B 的无边框矢量图标。</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D9A6"/>
      <stop offset="47%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="shine" cx="22%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="60" y="60" width="600" height="600" rx="155" fill="url(#gold)"/>
  <rect x="68" y="68" width="584" height="584" rx="147" fill="url(#shine)"/>
  <path d="M 248 250 H 318 V 480 H 490 V 552 H 248 Z" fill="#FFFFFF"/>
  <path d="M 426 315 L 468 215 H 508 L 550 315 H 504 L 488 272 L 472 315 Z" fill="#FFFFFF"/>
</svg>
